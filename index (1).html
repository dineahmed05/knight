<style>
  :root{
    --bg:#000; --ink:#d6d6df; --dim:#5d5d6b; --faint:#2a2a33; --line:#16161c;
    --accent:#b794ff;
    --px:'Press Start 2P', ui-monospace, Menlo, Consolas, monospace;
    --vt:'VT323', ui-monospace, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden}
  body{font-family:var(--vt);-webkit-font-smoothing:none;font-smooth:never}
  .app{height:100vh;height:100dvh;max-width:860px;margin:0 auto;display:flex;flex-direction:column;position:relative}
  .stage{position:relative;flex:1 1 60%;min-height:0;overflow:hidden}
  .stage::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 55% 45% at 50% 50%, rgba(110,60,180,.20), transparent 70%)}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hud{position:absolute;font-family:var(--px);font-size:7px;line-height:2;color:var(--dim);letter-spacing:.02em;pointer-events:none;text-transform:lowercase}
  .hud b{font-weight:400;color:#b4b4c4}
  .hud,.hud-tr{text-shadow:0 0 3px #000,0 0 6px #000,1px 1px 0 #000}
  .hud-tr{top:calc(env(safe-area-inset-top,0px) + 16px);right:14px;display:flex;align-items:center;gap:7px;color:#9a9aa8}
  .dot{width:5px;height:5px;background:var(--accent);border-radius:50%;box-shadow:0 0 8px var(--accent);animation:blink 1.1s steps(2,jump-none) infinite}
  @keyframes blink{50%{opacity:.25}}
  .hud-bl{left:14px;bottom:10px}
  .ctrl{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;display:flex;gap:6px}
  .ctrl button{font-family:var(--px);font-size:7px;color:var(--dim);background:rgba(0,0,0,.4);border:1px solid var(--faint);
    padding:7px 8px;cursor:pointer;text-transform:lowercase;letter-spacing:.04em;transition:color .15s,border-color .15s}
  .ctrl button:hover,.ctrl button:focus-visible{color:var(--ink);border-color:#55555f;outline:none}
  .ctrl button[aria-pressed="true"]{color:var(--accent);border-color:#4a3a7a}
  .status{flex:none;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    font-family:var(--px);font-size:8px;color:var(--dim);background:#030305}
  .status .cmd{color:#e8e8f0}
  .status .cmd i{font-style:normal;color:var(--accent);margin-right:6px}
  .status .run{display:flex;align-items:center;gap:7px}
  .status .run .dot{width:4px;height:4px;animation:none;opacity:1}
  .code{position:relative;flex:1 1 36%;min-height:150px;overflow:hidden;background:#020204}
  .code::before{content:"";position:absolute;left:0;right:0;top:0;height:46px;z-index:2;pointer-events:none;
    background:linear-gradient(#020204,rgba(2,2,4,0))}
  .lines{position:absolute;left:0;right:0;bottom:0;top:0;overflow:hidden;padding:10px 0 12px;
    display:flex;flex-direction:column;justify-content:flex-end}
  .ln{display:flex;font-size:clamp(14px,3.9vw,19px);line-height:1.2;color:#c7c7d3;white-space:pre;min-height:1.2em}
  .ln i{flex:none;width:44px;padding-right:14px;text-align:right;color:#34343f;font-style:normal;border-left:2px solid transparent}
  .ln.cur{background:linear-gradient(90deg,rgba(170,120,255,.16),rgba(170,120,255,0) 70%)}
  .ln.cur i{border-left-color:var(--accent);color:#cdb4ff}
  .k{color:#c9a0ff}.b{color:#a9b8ff}.f{color:#ffd479}.n{color:#ffa066}.s{color:#a3d977}.c{color:#4e4e5f}.u{color:#7fd4ff}
  .caret{display:inline-block;width:.55em;height:1em;background:var(--accent);vertical-align:-.12em;margin-left:1px;animation:blink 1s steps(2,jump-none) infinite}
  #gate{position:fixed;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center;
    transition:opacity .9s ease, visibility .9s}
  #gate.off{opacity:0;visibility:hidden;pointer-events:none}
  .gate-in{text-align:center;padding:24px}
  .gate-in .t1{font-family:var(--px);font-size:11px;color:#e8e8f0;margin:0 0 34px;letter-spacing:.03em}
  .gate-in .t1 span{color:var(--accent)}
  #go{font-family:var(--px);font-size:9px;color:#fff;background:transparent;border:1px solid #4a3a7a;padding:15px 20px;cursor:pointer;
    letter-spacing:.08em;position:relative;transition:background .2s,border-color .2s,box-shadow .2s}
  #go:hover,#go:focus-visible{background:rgba(183,148,255,.1);border-color:var(--accent);box-shadow:0 0 28px rgba(183,148,255,.25);outline:none}
  .gate-in .t2{font-family:var(--px);font-size:7px;color:var(--dim);margin:26px 0 0;line-height:2}
  @media (min-width:700px){.hud{font-size:8px}.ctrl button{font-size:8px}.status{font-size:9px;height:38px}}
  @media (max-height:520px){.code{flex-basis:30%;min-height:90px}}
  noscript{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#aaa;font-family:monospace;z-index:30}
</style>
</head>

<main class="app">
  <section class="stage" id="stage" aria-label="A knight asleep in a field of lavender">
    <canvas id="cv"></canvas>
    <div class="ctrl">
      <button id="snd" type="button" aria-pressed="false" title="Toggle music (M)">snd on</button>
      <button id="rep" type="button" title="Replay (R)">replay</button>
    </div>
    <div class="hud hud-tr"><span class="dot"></span><span id="hT">t 00.00s</span></div>
    <div class="hud hud-bl">
      <div id="hH">@handle / 2026</div>
      <div>rotation <b id="hR">000.00°</b></div>
      <div>glints <b id="hG">0</b></div>
      <div>letters <b id="hL">0</b></div>
    </div>
  </section>
  <div class="status">
    <span class="cmd"><i>$</i>py <span id="hS">knight.py</span></span>
    <span class="run"><span class="dot"></span><span>running | <span id="hF">60</span> fps</span></span>
  </div>
  <section class="code" aria-hidden="true"><div class="lines" id="lines"></div></section>
</main>
<div id="gate">
  <div class="gate-in">
    <p class="t1"><span>$</span> py <span id="gS" style="color:inherit">knight.py</span><span class="caret"></span></p>
    <button id="go" type="button">PRESS TO RUN</button>
    <p class="t2">sound on / headphones help</p>
  </div>
</div>

/* ---------- colour classes (built from the picture itself) ---------- */
const LV = 14;
const NHUE = 12;
const C_DARK = 0, C_STEEL_W = 1, C_STEEL_C = 2, C_HUE0 = 3;
const NCOL = C_HUE0 + NHUE * 2;       // image classes
const C_FLASH = NCOL, C_DUST = NCOL + 1;
const NCLS = NCOL + 2;
const CHARS_A = [' ','.',',',':',';','i','l','t','o','x','e','8','#','@'];
const CHARS_B = [' ','`',"'",'-','~','+','r','s','c','z','a','0','%','&'];
const BLADES_A = [' ','.',"'",'`',',','!','|','l','i','/','\\','Y','V','W'];
const BLADES_B = [' ',"'",'.','`','|',':','!','1','/','\\','I','Y','X','H'];
const isGrass = c => c >= C_HUE0 && c < C_HUE0 + NHUE*2 && [2,3,4].includes((c - C_HUE0) >> 1);
let RAMPS = [];

function rampColor(stops, b){
  for(let i=1;i<stops.length;i++){
    if(b<=stops[i][0]){
      const [t0,c0]=stops[i-1], [t1,c1]=stops[i];
      const f=(b-t0)/(t1-t0||1);
      return [c0[0]+(c1[0]-c0[0])*f, c0[1]+(c1[1]-c0[1])*f, c0[2]+(c1[2]-c0[2])*f];
    }
  }
  return stops[stops.length-1][1];
}

function classOf(r, g, b){
  const mx = max(r,g,b), mn = min(r,g,b);
  if(mx < 16) return C_DARK;
  const sat = (mx - mn) / mx;
  if(sat < 0.16) return r >= b + 4 ? C_STEEL_W : C_STEEL_C;
  let h;
  const d = mx - mn;
  if(mx === r) h = ((g - b) / d) % 6; else if(mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
  h = (h * 60 + 360) % 360;
  return C_HUE0 + (floor(h / 30) % NHUE) * 2 + (sat < 0.42 ? 0 : 1);
}

/* ---------- the picture ---------- */
let IMG = null, LO = 0.05, HI = 0.95;
function analyze(){
  const w = 96, h = round(96 * IMG.height / IMG.width);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d', {willReadFrequently:true});
  g.imageSmoothingQuality = 'high';
  g.drawImage(IMG, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data;
  const acc = Array.from({length:NCOL}, () => [0,0,0,0]);
  const lums = [];
  for(let i=0; i<w*h; i++){
    const r=d[i*4], gg=d[i*4+1], b=d[i*4+2];
    const L = (0.299*r + 0.587*gg + 0.114*b) / 255;
    lums.push(L);
    const mx = max(r,gg,b, 1);
    const k = classOf(r,gg,b);
    const a = acc[k]; a[0]+=r/mx*255; a[1]+=gg/mx*255; a[2]+=b/mx*255; a[3]++;
  }
  lums.sort((a,b)=>a-b);
  LO = lums[floor(lums.length*0.04)]; HI = lums[floor(lums.length*0.985)];
  if(HI - LO < 0.1){ LO = 0; HI = 1; }
  RAMPS = [];
  for(let k=0; k<NCOL; k++){
    const a = acc[k];
    let col = a[3] ? [a[0]/a[3], a[1]/a[3], a[2]/a[3]] : [200,200,210];
    if(k === C_DARK) col = [60,60,90];
    const mix = (c, f) => [c[0]+(255-c[0])*f, c[1]+(255-c[1])*f, c[2]+(255-c[2])*f];
    const sc = (c, f) => [c[0]*f, c[1]*f, c[2]*f];
    RAMPS.push([[0, sc(col,.07)], [.5, sc(col,.52)], [.85, col], [1, mix(col,.62)]]);
  }
  RAMPS[C_FLASH] = [[0,[90,90,100]],[1,[255,255,255]]];
  RAMPS[C_DUST]  = [[0,[26,24,40]],[1,[205,190,240]]];
}

function makeFlare(){
  const s=96, c=document.createElement('canvas'); c.width=c.height=s;
  const g=c.getContext('2d');
  const rg=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  rg.addColorStop(0,'rgba(255,255,255,1)'); rg.addColorStop(.1,'rgba(235,222,255,.75)');
  rg.addColorStop(.4,'rgba(170,120,255,.14)'); rg.addColorStop(1,'rgba(0,0,0,0)');

  lh.addColorStop(0,'rgba(255,255,255,0)'); lh.addColorStop(.5,'rgba(255,255,255,.95)'); lh.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=lh; g.fillRect(0,s/2-1,s,2);
  const lv=g.createLinearGradient(0,0,0,s);
  lv.addColorStop(0,'rgba(255,255,255,0)'); lv.addColorStop(.5,'rgba(255,255,255,.95)'); lv.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=lv; g.fillRect(s/2-1,0,2,s);
  return c;
}

function hasVT(){
  // true only when VT323 is really loaded (fonts.check lies when the file failed to download)
  try{
    const g = document.createElement('canvas').getContext('2d');
    g.font = "100px monospace"; const a = g.measureText('MWi8').width;
    g.font = "100px 'VT323', monospace"; const b = g.measureText('MWi8').width;
    return abs(a - b) > 1;
  }catch(e){ return false; }
}
function buildAtlas(){
  const vt = hasVT();
  const key = round(CH*100) + '@' + DPR + '@' + RAMPS.length + '@' + vt;
  if(key === ATLAS_KEY || !RAMPS.length) return;
  ATLAS_KEY = key;
  const size = max(6, Math.ceil(CH * 1.85));
  SPRW = size;
  const fontPx = CH * (vt ? 1.9 : 1.3);
  // one sheet holding every letter: far cheaper to draw from than hundreds of tiny canvases
  const cn = document.createElement('canvas'); cn.width = size*LV*2; cn.height = size*NCLS;
  const g = cn.getContext('2d');
  g.font = `${fontPx}px 'VT323', ui-monospace, Menlo, monospace`;
  g.textAlign='center'; g.textBaseline='middle';
  for(let c=0; c<NCLS; c++){
    for(let l=0; l<LV; l++){
      const col = rampColor(RAMPS[c], pow(l/(LV-1), 0.9));
      g.fillStyle = `rgb(${col[0]|0},${col[1]|0},${col[2]|0})`;
      for(let v=0; v<2; v++){
        const set = isGrass(c) ? (v?BLADES_B:BLADES_A) : (v?CHARS_B:CHARS_A);
        g.fillText(set[l], (l*2+v)*size + size/2, c*size + size/2 + size*0.02);
      }
    }
  }
  ATLAS = cn;
  if(!FLARE) FLARE = makeFlare();
}

/* the knight's outline (traced on the picture, 480x600 space), his pivot (hips) and spine direction */
const KNIGHT_POLY = [[105,200],[122,170],[155,166],[200,180],[220,205],[238,236],[290,234],[315,255],[345,275],[380,290],
  [410,305],[420,335],[436,365],[450,392],[446,410],[420,410],[385,402],[355,395],[335,380],[300,388],[268,385],[262,410],[285,445],[310,470],[305,492],
  [278,485],[240,460],[205,430],[180,395],[150,365],[145,320],[150,300],[120,270],[105,240]].map(([x,y]) => [x/480, y/600]);
const PIVOT = [235/480, 385/600];
const AXIS  = [-0.43, -0.90];
const MAXA  = 0.55;          // how far he is propped up at the start (rad)

/* sample the picture onto the letter grid */
function buildGrid(){
  if(!IMG) return;
  const ar = IMG.width / IMG.height;
  IH = H / 0.88; IW = IH * ar;                // picture fills the screen (a sliver of sky/ground is cropped)
  const left = (W - IW) / 2, top = -0.08 * IH;
  const coarse = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || W / DPR < 600;
  const cap = (coarse ? 12500 : 22000) / QUAL;
  let cw = DPR * max(2.6, min(4.2, (W/DPR) * 0.0085)) * sqrt(QUAL);
  let ch = cw * 1.22;
  let cols = Math.ceil(W/cw), rows = Math.ceil(H/ch);
  while(cols*rows > cap){ cw *= 1.05; ch = cw*1.22; cols = Math.ceil(W/cw); rows = Math.ceil(H/ch); }
  COLS = cols; ROWS = rows;
  CW = W / COLS; CH = H / ROWS; OX = 0; OY = 0;

  // the field continues past the picture's edges (mirrored), so letters fill the whole screen
  const c = document.createElement('canvas'); c.width = COLS; c.height = ROWS;
  const g = c.getContext('2d', {willReadFrequently:true});
  g.imageSmoothingQuality = 'high';
  const gw = IW / CW, gl = left / CW;
  for(let k=-6; k<=6; k++){
    const x = gl + k*gw;
    if(x > COLS || x + gw < 0) continue;
    g.save();
    if(k & 1){ g.translate(x + gw, 0); g.scale(-1, 1); g.drawImage(IMG, 0, top/CH, gw, IH/CH); }
    else g.drawImage(IMG, x, top/CH, gw, IH/CH);
    g.restore();
  }
  const d = g.getImageData(0, 0, COLS, ROWS).data;
  const N = COLS * ROWS;
  CL = new Uint8Array(N); BRI = new Float32Array(N); MET = new Float32Array(N); KM = new Uint8Array(N);
  SOFT = new Float32Array(N); DEP = new Float32Array(N); RP = new Float32Array(N); WQ = new Uint8Array(N);
  const L = new Float32Array(N), SAT = new Float32Array(N);
  const rnd = mulberry32(20261107);
  for(let i=0; i<N; i++){
    const r=d[i*4], gg=d[i*4+1], b=d[i*4+2];
    const mx = max(r,gg,b), mn = min(r,gg,b);
    SAT[i] = mx ? (mx-mn)/mx : 0;
    const lum = (0.299*r + 0.587*gg + 0.114*b) / 255;
    L[i] = lum;
    CL[i] = classOf(r, gg, b);
    BRI[i] = min(1, max(0, (lum - LO) / (HI - LO)));
    RP[i] = rnd() * 6.2832;
  }
  const LUM_RAW = L;
  // the knight: rasterise his outline onto the grid. Only the centre copy of the picture holds the
  // real knight; the mirrored copies on the sides get the same outline so they can be painted over with flowers.
  const KALL = new Uint8Array(N);
  {
    const mk = () => { const m = document.createElement('canvas'); m.width = COLS; m.height = ROWS;
      const x = m.getContext('2d', {willReadFrequently:true}); x.fillStyle = '#fff'; return [m, x]; };
    const [, mgC] = mk(), [, mgA] = mk();
    for(let k=-6; k<=6; k++){
      const x0 = left + k*IW;
      if(x0 > W || x0 + IW < 0) continue;
      for(const mg of (k === 0 ? [mgC, mgA] : [mgA])){
        mg.beginPath();
        KNIGHT_POLY.forEach(([nx, ny], n) => {
          const x = (x0 + ((k & 1) ? 1 - nx : nx) * IW) / CW, y = (top + ny * IH) / CH;
          n ? mg.lineTo(x, y) : mg.moveTo(x, y);
        });
        mg.closePath(); mg.fill();
      }
    }
    const mdC = mgC.getImageData(0, 0, COLS, ROWS).data, mdA = mgA.getImageData(0, 0, COLS, ROWS).data;
    for(let i=0; i<N; i++){
      const a = mdC[i*4+3]; KM[i] = a > 127 ? 1 : 0; MET[i] = a / 255 * 0.9;
      KALL[i] = (mdA[i*4+3] > 60) ? 1 : 0;
    }
    for(let i=0; i<N; i++) SOFT[i] = min(1, max(0, (SAT[i] - 0.12) / 0.3)) * (1 - MET[i]);
    // the knight gets his own tone stretch, so dark plates and joints stay readable
    const kl = [];
    for(let i=0; i<N; i++) if(KM[i]) kl.push(L[i]);
    kl.sort((a,b)=>a-b);
    if(kl.length > 20){
      const lo = kl[floor(kl.length*0.03)], hi = kl[floor(kl.length*0.985)];
      for(let i=0; i<N; i++) if(MET[i] > 0.05){
        const bk = min(1, max(0, (L[i] - lo) / max(0.05, hi - lo)));
        BRI[i] = BRI[i] * (1 - MET[i]/0.9) + bk * (MET[i]/0.9);
      }
    }
  }
  // local contrast: lift detail (helmet edges, plates) out of the flat purple
  {
    let a0 = Float32Array.from(BRI), b0 = new Float32Array(N);
    for(let pass=0; pass<2; pass++){
      for(let y=0; y<ROWS; y++) for(let x=0; x<COLS; x++){
        let s=0,n=0;
        for(let dy=-3; dy<=3; dy++) for(let dx=-3; dx<=3; dx++){
          const xx=x+dx, yy=y+dy; if(xx<0||yy<0||xx>=COLS||yy>=ROWS) continue; s+=a0[yy*COLS+xx]; n++;
        }
        b0[y*COLS+x]=s/n;
      }
      const t=a0; a0=b0; b0=t;
    }
    for(let i=0; i<N; i++){
      const v = BRI[i] + 1.5 * (BRI[i] - a0[i]);
      let b = pow(min(1, max(0, 0.15 + v * 0.95)), 0.9);
      const m = MET[i] / 0.9;
      b = b * (0.62 + 0.38 * m) + 0.20 * m;                  // the knight stands out, the field recedes
      BRI[i] = min(1, b);
    }
  }
  // depth: blurred light + a soft pull towards the middle
  {
    let a = L.slice(), bb = new Float32Array(N);
    for(let pass=0; pass<3; pass++){
      for(let y=0; y<ROWS; y++) for(let x=0; x<COLS; x++){
        let s=0,n=0;
        for(let dy=-2; dy<=2; dy++) for(let dx=-2; dx<=2; dx++){
          const xx=x+dx, yy=y+dy; if(xx<0||yy<0||xx>=COLS||yy>=ROWS) continue; s+=a[yy*COLS+xx]; n++;
        }
        bb[y*COLS+x]=s/n;
      }
      const t=a; a=bb; bb=t;
    }
    for(let y=0; y<ROWS; y++) for(let x=0; x<COLS; x++){
      const nx = x/COLS - 0.5, ny = y/ROWS - 0.5;
      const mid = exp(-(nx*nx*5 + ny*ny*4));
      DEP[y*COLS+x] = min(1, max(0, 0.45*a[y*COLS+x]*1.6 + 0.55*mid));
    }
  }
  // the ground he leaves behind: flowers copied in over his outline
  PCL = CL.slice(); PBRI = BRI.slice(); PSOFT = SOFT.slice();
  {
    const DX=[1,-1,0,0,1,-1,1,-1], DY=[0,0,1,-1,1,1,-1,-1];
    for(let j=0; j<ROWS; j++) for(let i=0; i<COLS; i++){
      const idx = j*COLS + i;
      if(!KALL[idx]) continue;
      const o = floor(rnd()*8);
      let done = false;
      for(let r=2; r<80 && !done; r+=2) for(let k=0; k<8; k++){
        const dd = (k+o)&7, xx = i+DX[dd]*r, yy = j+DY[dd]*r;
        if(xx<0||yy<0||xx>=COLS||yy>=ROWS) continue;
        const q = yy*COLS + xx; if(KALL[q]) continue;
        PCL[idx]=CL[q]; PBRI[idx]=BRI[q]; PSOFT[idx]=SOFT[q]; done = true; break;
      }
    }
  }
  // how much each cell bends with his spine (0 = legs stay, 1 = shoulders and head)
  PVX = left + PIVOT[0]*IW; PVY = top + PIVOT[1]*IH;
  {
    const k = IW / 480;
    for(let j=0; j<ROWS; j++) for(let i=0; i<COLS; i++){
      const sN = (((i+0.5)*CW - PVX)*AXIS[0] + ((j+0.5)*CH - PVY)*AXIS[1]) / k;
      let w = (sN + 35) / 90; w = w < 0 ? 0 : (w > 1 ? 1 : w); w = w*w*(3 - 2*w);
      WQ[j*COLS + i] = round(w * 64);
    }
  }
  // glints: the brightest steel
  FLARES = [];
  const cand = [];
  for(let i=0; i<N; i++) if(KM[i] && BRI[i] > 0.8) cand.push(i);
  for(let k=0; k<cand.length && FLARES.length < 60; k++){
    const i = cand[floor(rnd()*cand.length)];
    FLARES.push({i, ph: rnd()*6.2832, sp: 1.2 + rnd()*2.2, big: BRI[i] > 0.95});
  }
  // pollen / stars drifting up
  DUST.length = 0;
  for(let i=0; i<170; i++) DUST.push({
    x: rnd(), y: rnd(), vy: 0.012 + rnd()*0.035, ph: rnd()*6.2832, sp: 0.8 + rnd()*2.6, ta: rnd()*3
  });
}

function resize(){
  const r = cv.getBoundingClientRect();
  DPR = min(2, window.devicePixelRatio || 1);
  W = max(2, round(r.width * DPR));
  H = max(2, round(r.height * DPR));
  cv.width = W; cv.height = H;
  buildGrid();
  buildAtlas();
}

/* ---------- renderer ---------- */
let lastLetters=0, lastGlints=0, lastAng=0;

/* 1 = propped up on his back, 0 = lying in the lavender */
const HOLD = 0.9, FALL = 3.2;
function lean(t){
  if(t < HOLD) return 1;
  const p = (t - HOLD) / FALL;
  if(p < 1){ const e = p*p*p*(p*(p*6 - 15) + 10); return 1 - e; }
  const d = t - HOLD - FALL;
  return 0.06 * exp(-4*d) * abs(sin(13*d));      // a small settle when he lands
}
const SWAMP = 1.0;

function render(t, dt){
  const ang = qs.has('ang') ? parseFloat(qs.get('ang')) : 0.14*t + 0.4;
  lastAng = ang;

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);
  if(!CL || !ATLAS) return;

  const rr = lean(t);
  const th = rr * MAXA + 0.010 * sin(t*1.1);    // + a slow breath
  for(let q=0; q<=64; q++){ const a = th * q / 64; TC[q] = cos(a); TS[q] = sin(a); }
  const landed = t > HOLD + FALL + 0.4;

  const par = sin(t*0.5 + 0.4);                 // slow parallax swing
  const gpos = ((t*0.22) % 1.9) - 0.35;         // steel glint sweep
  let letters = 0, glints = 0;
  const S = SPRW, half = S / 2;

  for(let j=0; j<ROWS; j++){
    const rowBase = j*COLS;
    const cy = (j + 0.5) * CH - half;
    const rowW = 0.8 + 0.6 * j / ROWS;
    for(let i=0; i<COLS; i++){
      let ii = i - round((DEP[rowBase+i] - 0.5) * par * 3.4);
      ii = ii < 0 ? 0 : (ii >= COLS ? COLS-1 : ii);
      const idx = rowBase + ii;

      // is this cell showing the knight? (he bends about his hips)
      let sidx = -1;
      const q = WQ[idx];
      if(q > 0){
        const c = TC[q], s = TS[q];
        const px = (ii + 0.5) * CW - PVX, py = (j + 0.5) * CH - PVY;
        const si = round((px*c + py*s + PVX) / CW - 0.5), sj = round((-px*s + py*c + PVY) / CH - 0.5);
        if(si >= 0 && sj >= 0 && si < COLS && sj < ROWS){ const k = sj*COLS + si; if(KM[k]) sidx = k; }
      } else if(KM[idx]) sidx = idx;

      let cls, b, met = 0;
      if(sidx >= 0){ cls = CL[sidx]; b = BRI[sidx]; met = MET[sidx]; }
      else {
        const s0 = PSOFT[idx];
        let sw = 0, sheen = 0;
        if(s0 > 0.02){
          // a gust rolls across the field from left to right; small turbulence rides on top
          let gu = 0.5 + 0.5*sin(0.05*i - 1.35*t + 0.028*j); gu = gu*gu;
          sw = ((gu - 0.35) * 3.2 + 0.7*sin(t*2.3 + j*0.12 + i*0.07)) * SWAMP * rowW * s0;
          sheen = gu * gu * 0.55;
        }
        let pi = ii - round(sw);
        pi = pi < 0 ? 0 : (pi >= COLS ? COLS-1 : pi);
        const pidx = rowBase + pi;
        cls = PCL[pidx]; b = PBRI[pidx];
        const sf = PSOFT[pidx];
        if(sf > 0) b *= 1 + sheen * sf + 0.12 * sf * sin(t*2.2 + RP[pidx]);
      }
      if(met > 0){
        const u = (ii/COLS)*0.7 + (j/ROWS)*0.5;
        const e = (u - gpos) / 0.07;
        const gl = exp(-e*e) * met;
        b += 0.6 * gl;
        if(gl > 0.4) glints++;
      }
      const lvl = round(pow(min(1, max(0, b)), 0.72) * (LV-1));
      if(lvl < 1) continue;
      ctx.drawImage(ATLAS, (lvl*2 + ((i+j)&1)) * S, cls * S, S, S, ((i + 0.5) * CW - half)|0, cy|0, S, S);
      letters++;
    }
  }

  // pollen
  for(const d of DUST){
    if(t < d.ta) continue;
    d.y -= d.vy*dt;
    if(d.y < -0.05) d.y = 1.05;
    const x = (d.x + sin(t*0.5 + d.ph)*0.012) * W;
    const y = d.y * H;
    const tw = max(0, sin(t*d.sp + d.ph));
    const lvl = 1 + ((tw*tw)*5|0);
    if(tw > 0.35) glints++;
    ctx.drawImage(ATLAS, (lvl*2 + (lvl&1)) * S, C_DUST * S, S, S, (x - half)|0, (y - half)|0, S, S);
    letters++;
  }

  // flares (once he has settled, so they sit on his armour)
  if(landed){
    ctx.globalCompositeOperation = 'lighter';
    for(const f of FLARES){
      const tw = pow(max(0, sin(t*f.sp + f.ph)), 7);
      const inten = (f.big ? 0.22 : 0.0) + tw*(f.big ? 0.95 : 0.8);
      if(inten < 0.05) continue;
      const cx = ((f.i % COLS) + 0.5) * CW, cy2 = (floor(f.i / COLS) + 0.5) * CH;
      const s2 = (f.big ? 30 : 22) * (0.5 + tw*0.8) * DPR;
      ctx.globalAlpha = min(1, inten);
      ctx.drawImage(FLARE, cx - s2/2, cy2 - s2/2, s2, s2);
      glints++;
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }

  lastLetters = letters;
  lastGlints = glints;
}

/* ---------- code panel ---------- */
const SECTIONS = [
{ t0:0, t1:1.0, src:
`import numpy as np
from PIL import Image
TAU = 2 * np.pi

# -- load: a knight, asleep in the lavender --
img = Image.open("knight.jpg").convert("RGB")
COLS, ROWS = 120, 150
grid = np.asarray(img.resize((COLS, ROWS)))

` },
{ t0:1.0, t1:1.6, src:
`# -- letters: light becomes a character --
RAMP = " .,:;itoxe8#@"

    lum = rgb @ [0.299, 0.587, 0.114] / 255

` },
{ t0:1.6, t1:2.4, src:
`# -- colour: every letter keeps its hue --
def hue(rgb):
    r, g, b = rgb / 255
    sat = (max(r, g, b) - min(r, g, b)) / max(r, g, b, 1e-6)

        return "steel"

` },
{ t0:2.4, t1:4.5, src:
`# -- pose: he sits up, then the ground takes him --
RAISED = 0.55
def lean(t):
    p = np.clip((t - 0.9) / 3.2, 0, 1)
    return RAISED * (1 - smoother(p))

def bend(point, pivot, angle):
    # the spine bends, the legs stay
    w = smoothstep(-35, 55, along_spine(point))
    return rotate(point, pivot, angle * w)

# -- wind: the lavender sways, the steel does not --
def sway(t, i, j, soft):
    return (np.sin(1.5 * t + 0.10 * j + 0.04 * i)
          + 0.5 * np.sin(2.7 * t + 0.23 * i)) * soft

` },
{ t0:4.5, t1:7.0, src:

def glint(t, u, metal):
    band = np.exp(-((u - SWEEP(t)) / 0.07) ** 2)
    return 0.60 * band * metal

# -- depth: brighter means closer --
depth = blur(lum, passes=3)

# the wind never stops. the knight rests.` }
];
const FULL = SECTIONS.map(s => s.src).join('');
const LINES = FULL.split('\n');
const LINE_START = []; { let o=0; LINES.forEach(l => { LINE_START.push(o); o += l.length+1; }); }

const KW = new Set(['import','as','def','for','in','return','if','else','from','class','while','not','and','or']);
const BI = new Set(['range','int','len','max','min','sum','abs']);
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hl(line){
  const re = /(#.*)|("[^"]*"|'[^']*')|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_][A-Za-z_0-9]*\b)|(\s+|.)/g;
  let out='', m, prevDef=false;
  while((m = re.exec(line))){
    if(m[1]) out += `<span class="c">${esc(m[1])}</span>`;
    else if(m[2]) out += `<span class="s">${esc(m[2])}</span>`;
    else if(m[3]) out += `<span class="n">${m[3]}</span>`;
    else if(m[4]){
      const w = m[4];
      if(prevDef){ out += `<span class="f">${w}</span>`; prevDef=false; }
      else if(KW.has(w)){ out += `<span class="k">${w}</span>`; prevDef = (w==='def'||w==='class'); }
      else if(BI.has(w)) out += `<span class="b">${w}</span>`;
      else if(/^[A-Z][A-Z_0-9]+$/.test(w)) out += `<span class="u">${w}</span>`;
      else out += w;
    } else out += esc(m[5]);
  }
  return out;
}
function hlPartial(line, n){
  if(n >= line.length) return hl(line);
  return hl(line.slice(0, n));
}

const linesEl = $('lines');
let lineEls = [], lineDone = [];
function typedCount(t){
  let c = 0;
  for(const s of SECTIONS){
    const len = s.src.length;
    if(t >= s.t1) c += len;
    else if(t > s.t0) c += floor((t - s.t0) / (s.t1 - s.t0) * len);
  }
  return c;
}
let lastCount = -1;
function updateCode(t){
  const count = min(FULL.length, typedCount(t));
  if(count === lastCount) return;
  lastCount = count;
  let li = 0;
  while(li+1 < LINES.length && LINE_START[li+1] <= count) li++;
  const col = count - LINE_START[li];
  while(lineEls.length <= li){
    const d = document.createElement('div'); d.className='ln';
    d.innerHTML = `<i>${lineEls.length+1}</i><span class="tx"></span>`;
    linesEl.appendChild(d); lineEls.push(d); lineDone.push(false);
  }
  while(lineEls.length > li+1){ linesEl.removeChild(lineEls.pop()); lineDone.pop(); }
  for(let j=0; j<li; j++){
    if(!lineDone[j]){ lineEls[j].querySelector('.tx').innerHTML = hl(LINES[j]) || ' '; lineDone[j] = true; }
    lineEls[j].classList.remove('cur');
  }
  lineDone[li] = false;
  const el = lineEls[li]; el.classList.add('cur');
  const done = count >= FULL.length;
  el.querySelector('.tx').innerHTML = hlPartial(LINES[li], col) + (done ? '' : '<span class="caret"></span>') || ' ';
}

/* ---------- music ---------- */
const Music = (() => {
  let ctx=null, master=null, bus=null, timer=null, nextT=0, step=0;
  let started=false, muted=false, el=null, melIdx=4;
  const STEP = 0.64;
  const midi = m => 440 * Math.pow(2, (m-69)/12);
  const CHORDS = [
    { bass:45, pad:[57,60,64,71] },
    { bass:41, pad:[57,60,64,69] },
    { bass:48, pad:[55,60,64,67] },
    { bass:43, pad:[55,59,62,64] }
  ];
  const MEL = [64,67,69,72,74,76,79,81,84];
  function makeIR(c, sec, decay){
    const len = floor(c.sampleRate*sec), buf = c.createBuffer(2, len, c.sampleRate);
    for(let ch=0; ch<2; ch++){ const d = buf.getChannelData(ch); for(let i=0; i<len; i++) d[i] = (Math.random()*2-1) * pow(1-i/len, decay); }
    return buf;
  }
  function init(){
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
    master.connect(comp); comp.connect(ctx.destination);
    bus = ctx.createGain(); bus.gain.value = 1;
    const dry = ctx.createGain(); dry.gain.value = 0.75; bus.connect(dry); dry.connect(master);
    const conv = ctx.createConvolver(); conv.buffer = makeIR(ctx, 3.6, 2.6);
    const wet = ctx.createGain(); wet.gain.value = 0.6; bus.connect(conv); conv.connect(wet); wet.connect(master);
    const dl = ctx.createDelay(2); dl.delayTime.value = 0.48;
    const fb = ctx.createGain(); fb.gain.value = 0.34;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 2200;
    const dw = ctx.createGain(); dw.gain.value = 0.32;
    bus.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(dw); dw.connect(master);
  }
  function pad(f, t, dur){
    const g = ctx.createGain(), lp = ctx.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value = 1000; lp.Q.value = 0.3;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.042, t + 2.3);
    g.gain.setValueAtTime(0.042, t + dur - 2.4);
    g.gain.linearRampToValueAtTime(0, t + dur);
    [['triangle',-7],['sine',6]].forEach(([type, det]) => {
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = det;
      o.connect(lp); o.start(t); o.stop(t + dur + 0.1);
    });
    lp.connect(g); g.connect(bus);
  }
  function bass(f, t, dur){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.11, t+0.08);
    g.gain.exponentialRampToValueAtTime(0.0008, t+dur);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t+dur+0.1);
  }
  function bell(f, t, vel){
    const g = ctx.createGain();
    const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vel, t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t+2.6);
    [[1,1],[2,0.28],[3.01,0.07],[5.4,0.025]].forEach(([m,a]) => {
      const o = ctx.createOscillator(), og = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f*m; og.gain.value = a;
      o.connect(og); og.connect(g); o.start(t); o.stop(t+2.7);
    });
    if(pan){ pan.pan.value = (Math.random()*2-1)*0.55; g.connect(pan); pan.connect(bus); }
    else g.connect(bus);
  }
  function schedule(){
    while(nextT < ctx.currentTime + 1.3){
      const inChord = step % 8, ci = floor(step/8) % 4, ch = CHORDS[ci];
      if(inChord === 0){
        const dur = STEP*8 + 2.2;
        ch.pad.forEach(m => pad(midi(m), nextT, dur));
        bass(midi(ch.bass), nextT, STEP*7);
        bass(midi(ch.bass+12), nextT+STEP*4, STEP*3.5);
      }
      const p = (inChord % 2 === 0) ? 0.66 : 0.26;
      if(Math.random() < p){
        const jump = Math.random() < 0.18;
        melIdx = max(0, min(MEL.length-1, melIdx + (jump ? (Math.random()<0.5?-3:3) : [-1,1,-1,1,-2,2][floor(Math.random()*6)])));
        bell(midi(MEL[melIdx]), nextT + Math.random()*0.03, 0.05 + Math.random()*0.05);
      }
      nextT += STEP; step++;
    }
  }
  return {
    start(){
      if(started) return;
      started = true;
      if(CONFIG.audioFile){
        el = new Audio(CONFIG.audioFile); el.loop = true; el.volume = CONFIG.volume;
        el.play().catch(()=>{}); return;
      }
      try{
        init();
        if(ctx.state === 'suspended') ctx.resume();
        nextT = ctx.currentTime + 0.2;
        schedule(); timer = setInterval(schedule, 120);
        master.gain.setValueAtTime(0, ctx.currentTime);
        master.gain.linearRampToValueAtTime(muted ? 0 : CONFIG.volume, ctx.currentTime + 4);
      }catch(e){ console.warn('audio unavailable', e); }
    },
    setMuted(m){
      muted = m;
      if(el){ el.muted = m; return; }
      if(master){
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.linearRampToValueAtTime(m ? 0 : CONFIG.volume, ctx.currentTime + 0.6);
      }
    },
    pause(){ if(ctx && ctx.state === 'running') ctx.suspend(); if(el) el.pause(); },
    resume(){ if(ctx && ctx.state === 'suspended') ctx.resume(); if(el && started) el.play().catch(()=>{}); },
    get started(){ return started; }
  };
})();

/* ---------- main loop ---------- */
let slow=0, running=false, t0=0, lastNow=0, fpsAcc=0, fpsN=0, hudT=0;
const hT = $('hT'), hR = $('hR'), hG = $('hG'), hL = $('hL'), hF = $('hF');
const fmt = n => n.toLocaleString('en-US');

const FPS = 30; let lastDraw = -1e9;
function frame(now){
  requestAnimationFrame(frame);
  if(!running) return;
  if(now - lastDraw < 1000 / FPS - 2) return;
  lastDraw = now;
  const dt = min(0.1, (now - lastNow)/1000);
  lastNow = now;
  const t = (now - t0)/1000;
  render(t, dt);
  updateCode(t);
  fpsAcc += dt; fpsN++;
  hudT += dt;
  if(hudT > 0.1){
    hudT = 0;
    hT.textContent = 't ' + t.toFixed(2).padStart(5,'0') + 's';
    const deg = ((lastAng*180/PI) % 360 + 360) % 360;
    hR.textContent = deg.toFixed(2).padStart(6,'0') + '°';
    hG.textContent = fmt(lastGlints);
    hL.textContent = fmt(lastLetters);
    if(fpsAcc > 0.5){
      const f = fpsN/fpsAcc; hF.textContent = round(f); fpsAcc = 0; fpsN = 0;
      if(t > 4 && f < 24 && QUAL < 1.5 && ++slow >= 3){ slow = 0; QUAL *= 1.15; resize(); }   // slow device: slightly fewer letters
      else if(f >= 24) slow = 0;
    }
  }
}

function start(skip=0){
  running = true;
  t0 = performance.now() - skip*1000;
  lastNow = performance.now();
  lastCount = -1;
  $('gate').classList.add('off');
  if(!skip) Music.start();
}

function replay(){
  lastCount = -1;
  lineEls.forEach(e => e.remove()); lineEls = []; lineDone = [];
  t0 = performance.now();
}

function loadImage(){
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error('image failed to load'));
    im.src = IMG_SRC;
  });
}

async function boot(){
  try {
    $('hH').textContent = CONFIG.handle + ' / ' + CONFIG.year;
    $('hS').textContent = CONFIG.script;
    $('gS').textContent = CONFIG.script;

    IMG = await loadImage();
    analyze();

    // load fonts in background (don't block)
    if(document.fonts){
      Promise.all([
        document.fonts.load("16px 'VT323'"),
        document.fonts.load("8px 'Press Start 2P'")
      ]).then(() => {
        ATLAS_KEY = '';
        buildAtlas();
      }).catch(() => {});
    }

    // wait one frame for layout to settle
    await new Promise(r => requestAnimationFrame(r));

    resize();
    new ResizeObserver(() => resize()).observe($('stage'));
    window.addEventListener('orientationchange', () => setTimeout(resize, 200));
    requestAnimationFrame(frame);

    $('go').addEventListener('click', () => start());
    $('rep').addEventListener('click', () => { if(running) replay(); });

    const snd = $('snd');
    snd.addEventListener('click', () => {
      const m = snd.getAttribute('aria-pressed') !== 'true';
      snd.setAttribute('aria-pressed', m);
      snd.textContent = m ? 'snd off' : 'snd on';
      Music.setMuted(m);
    });

    window.addEventListener('keydown', e => {
      if(e.key === 'm' || e.key === 'M') snd.click();
      else if(e.key === 'r' || e.key === 'R') $('rep').click();
      else if((e.key === 'Enter' || e.key === ' ') && !running){ e.preventDefault(); start(); }
    });
    document.addEventListener('visibilitychange', () => { document.hidden ? Music.pause() : Music.resume(); });

    if(qs.has('t')) start(parseFloat(qs.get('t')) || 0);   // ?t=12 jumps ahead (handy for previews)
    $('go').focus({preventScroll: true});
  } catch(err){
    console.error('boot failed:', err);
    document.body.innerHTML = '<pre style="color:#f88;padding:20px;font-family:monospace">Error: ' + err.message + '\n' + err.stack + '</pre>';
  }
}
boot();
})();
</script>
